:root {

.section { padding-block: clamp(38px, 5vw, 74px); }

.footer-links { display: flex; align-items: center; gap: 23px; flex-wrap: wrap; font-size: .9rem; }

.page-intro, .article-top { background: var(--sage); padding-block: clamp(44px, 6vw, 80px); }
.page-intro h1, .article-top h1 { margin-bottom: 16px; font-size: clamp(3rem, 6vw, 5.4rem); }
.page-intro p:last-child, .article-top p { color: var(--soft); max-width: 700px; font-size: 1.12rem; margin-bottom: 0; }
.event-hero { position: relative; isolation: isolate; color: white; background: var(--dark); }
.event-hero-image { position: absolute; z-index: -1; inset: 0; }
.event-hero-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #112e26fa 0%, #112e26d9 46%, #112e2680 100%); }
.event-hero-inner { display: grid; grid-template-columns: minmax(0, 1fr) 300px; align-items: end; gap: 50px; padding-block: 68px; }
.event-hero h1 { font-size: clamp(3rem, 6vw, 5.35rem); margin-bottom: 20px; }
.event-hero .eyebrow { color: var(--gold); }

.event-facts { margin: 0; padding: 22px; border: 1px solid #ffffff50; background: #112e26e8; border-radius: 8px; }

.event-facts dt { color: var(--gold); font-size: .79rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; }

.topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }

.back-link { display: inline-block; margin-bottom: 16px; text-decoration: none; font-weight: 700; }

.article-photo { width: 100%; aspect-ratio: 2.1; object-fit: cover; border-radius: 8px; margin-bottom: 27px; }

.draft-banner { display: flex; justify-content: center; align-items: center; gap: 18px; padding: 7px 20px; background: var(--gold); font-size: .86rem; font-weight: 700; }
.empty-draft { margin-block: 15px; color: var(--soft); }

.field textarea { resize: vertical; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

legend { font-weight: 700; padding: 0 5px; }

.event-poster img { width: 100%; max-height: min(calc(52vh - 10px), 350px); object-fit: contain; }

  .event-highlight { grid-template-columns: 1fr; gap: 16px; padding: 21px; }

<script>
(function (root) {
  "use strict";

  const DRAFT_KEY = "teachers-connect-education-draft-v1";
  const statusOptions = ["Tentative", "Confirmed", "To be announced"];
  const imageOptions = ["", "conclave", "hiring", "learning"];
  const defaultHome = {
    headlineTop: "Bringing schools",
    headlineMiddle: "and teachers",
    headlineEmphasis: "together.",
    description: "Explore the Education Conclave, teacher recruitment and professional development from Teachers Connect."
  };

  function imageValue(value, label) {
    if (typeof value !== "string") throw new Error(label + " must be text.");
    const clean = value.trim();
    if (imageOptions.includes(clean)) return clean;
    if (!clean) return "";
    let url;
    try { url = new URL(clean); } catch { throw new Error(label + " must be a Cloudinary image URL."); }
    if (url.protocol !== "https:" || url.hostname !== "res.cloudinary.com" || !url.pathname.includes("/image/upload/")) {
      throw new Error(label + " must be a Cloudinary image URL.");
    }
    return url.href;
  }

  function field(value, label, max, required = false) {
    if (typeof value !== "string") throw new Error(label + " must be text.");
    const clean = value.trim();
    if (required && !clean) throw new Error(label + " is required.");
    if (clean.length > max) throw new Error(label + " must be " + max + " characters or fewer.");
    return clean;
  }

  function dateValue(value, label) {
    const clean = field(value, label, 10);
    if (!clean) return "";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(clean)) throw new Error(label + " must be a valid date.");
    const parsed = new Date(clean + "T00:00:00Z");
    if (!Number.isFinite(+parsed) || parsed.toISOString().slice(0, 10) !== clean) {
      throw new Error(label + " must be a valid date.");
    }
    return clean;
  }

  function safeUrl(value, label) {
    const clean = field(value, label, 1600);
    if (!clean) return "";
    let url;
    try { url = new URL(clean); } catch { throw new Error(label + " must be a valid HTTPS link."); }
    if (url.protocol !== "https:" || !url.hostname || url.username || url.password) {
      throw new Error(label + " must be a valid HTTPS link.");
    }
    return url.href;
  }

  function linkPair(label, url, prefix) {
    const title = field(label, prefix + " label", 60);
    const href = safeUrl(url, prefix + " link");
    if (Boolean(title) !== Boolean(href)) throw new Error("Enter both the " + prefix.toLowerCase() + " label and link.");
    return [title, href];
  }

  function validateEvent(event) {
    if (!event || !statusOptions.includes(event.dateStatus)) throw new Error("Choose an event date status.");
    const date = dateValue(event.date, "Event date");
    if (event.dateStatus !== "To be announced" && !date) throw new Error("Enter an event date or set the date status to To be announced.");
    const [registrationLabel, registrationUrl] = linkPair(event.registrationLabel, event.registrationUrl, "Participation");
    if (!Array.isArray(event.tracks) || event.tracks.length > 8) throw new Error("Use up to eight programme topics.");
    const tracks = event.tracks.map(topic => ({
      title: field(topic?.title, "Programme topic title", 75, true),
      description: field(topic?.description, "Programme topic description", 350, true)
    }));
    return {
      title: field(event.title, "Event title", 110, true),
      date,
      dateStatus: event.dateStatus,
      city: field(event.city, "City", 80),
      venue: field(event.venue, "Venue", 140),
      summary: field(event.summary, "Event introduction", 560, true),
      tracks,
      awards: field(event.awards, "Awards description", 2000),
      registrationLabel,
      registrationUrl,
      heroImage: imageValue(event.heroImage || "", "Conclave hero image")
    };
  }

  function validateHome(home = {}) {
    return {
      headlineTop: field(home.headlineTop ?? defaultHome.headlineTop, "First headline line", 65, true),
      headlineMiddle: field(home.headlineMiddle ?? defaultHome.headlineMiddle, "Second headline line", 65, true),
      headlineEmphasis: field(home.headlineEmphasis ?? defaultHome.headlineEmphasis, "Emphasized headline line", 65, true),
      description: field(home.description ?? defaultHome.description, "Home introduction", 320, true)
    };
  }

  function validatePoster(poster = {}) {
    if (!poster || typeof poster !== "object" || Array.isArray(poster)) {
      throw new Error("Event poster settings must be an object.");
    }
    if (poster.enabled !== undefined && typeof poster.enabled !== "boolean") {
      throw new Error("Event poster visibility must be enabled or disabled.");
    }
    const image = imageValue(poster.image || "", "Event poster image");
    const enabled = poster.enabled ?? false;
    if (enabled && !image) throw new Error("Upload an event poster before showing it on the public site.");
    return { image, enabled };
  }

  function validatePost(post) {
    if (!post || !["initiative", "update"].includes(post.kind)) throw new Error("Choose an initiative or update.");
    const id = field(post.id, "Post ID", 100, true);
    if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(id)) throw new Error("Post IDs can contain lowercase letters, numbers and hyphens.");
    const image = imageValue(post.image || "", "Post image");
    const [linkLabel, linkUrl] = linkPair(post.linkLabel, post.linkUrl, "Optional");
    return {
      id,
      kind: post.kind,
      title: field(post.title, "Post title", 105, true),
      date: dateValue(post.date, "Post date"),
      summary: field(post.summary, "Post summary", 280, true),
      body: field(post.body, "Post body", 16000),
      image,
      linkLabel,
      linkUrl
    };
  }

  function validateLayouts(layouts = {}) {
    const pageNames = ["index", "conclave", "initiatives", "updates", "post", "poster"];
    if (!layouts || typeof layouts !== "object" || Array.isArray(layouts)) {
      throw new Error("Page layouts must be an object.");
    }
    const validated = {};
    for (const [page, elements] of Object.entries(layouts)) {
      if (!pageNames.includes(page) || !elements || typeof elements !== "object" || Array.isArray(elements)) {
        throw new Error("Choose a valid page layout.");
      }
      if (Object.keys(elements).length > 500) throw new Error("A page layout can contain up to 500 elements.");
      validated[page] = {};
      for (const [id, position] of Object.entries(elements)) {
        if (!/^[a-z0-9-]{1,140}$/.test(id) || !position || typeof position !== "object") {
          throw new Error("A page layout contains an invalid element.");
        }
        const x = position.x ?? 0;
        const y = position.y ?? 0;
        const scale = position.scale ?? 1;
        if (!Number.isFinite(x) || !Number.isFinite(y) || Math.abs(x) > 500 || Math.abs(y) > 500 ||
            !Number.isFinite(scale) || scale < 0.25 || scale > 4) {
          throw new Error("Layout positions or scale are outside the allowed range.");
        }
        validated[page][id] = { x, y, scale };
      }
    }
    return validated;
  }

  function validate(content) {
    if (!content || content.version !== 1 || !Array.isArray(content.posts) || content.posts.length > 250) {
      throw new Error("Choose a Teachers Connect content file with up to 250 posts.");
    }
    const posts = content.posts.map(validatePost);
    if (new Set(posts.map(post => post.id)).size !== posts.length) throw new Error("The content file contains duplicate posts.");
    return {
      version: 1,
      home: validateHome(content.home),
      event: validateEvent(content.event),
      poster: validatePoster(content.poster),
      posts,
      layouts: validateLayouts(content.layouts)
    };
  }

  function formatDate(date) {
    if (!date) return "";
    return new Intl.DateTimeFormat("en-IN", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" })
      .format(new Date(date + "T00:00:00Z"));
  }

  function eventDate(event) {
    return event.dateStatus === "To be announced" ? "Date to be announced" : formatDate(event.date);
  }

  function newId(title, posts) {
    const base = title.normalize("NFKD").toLowerCase().replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "").slice(0, 72).replace(/-+$/g, "") || "post";
    let id = base;
    for (let suffix = 2; posts.some(post => post.id === id); suffix++) id = base + "-" + suffix;
    return id;
  }

  const api = { DRAFT_KEY, statusOptions, imageOptions, validate, validateLayouts, validateHome, validateEvent, validatePoster, validatePost, formatDate, eventDate, newId };
  if (typeof module !== "undefined") module.exports = api;
  else root.TeacherContent = api;
})(globalThis);

</script>

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function href(target, params = {}) {
  const search = new URLSearchParams(params);
  if (isDraft && target !== "editor") search.set("draft", "1");
  const queryString = search.toString();
  return "#" + target + (queryString ? "?" + queryString : "");
}

function textBlocks(text, layoutPrefix = "") {
  return text.split(/\n\s*\n/).filter(Boolean).map((block, index) => "<p" +
    (layoutPrefix ? ' data-layout-id="' + escapeHtml(layoutPrefix + "-" + index) + '"' : "") + ">" +
    escapeHtml(block).replace(/\n/g, "<br>") + "</p>").join("");
}

function picture(key, cssClass, loading = "lazy") {
  if (typeof key === "string" && key.startsWith("https://res.cloudinary.com/")) {
    return '<img class="' + escapeHtml(cssClass) + '" src="' + escapeHtml(key) +
      '" alt="Teachers Connect" loading="' + escapeHtml(loading) + '" decoding="async">';
  }
  const asset = imageAssets[key];
  if (!asset) return "";
  return '<img class="' + cssClass + '" src="' + asset.src + '" alt="' + asset.alt +
    '" loading="' + loading + '" decoding="async">';
}

function applyPosition(element, position) {
  if (!element) return;
  if (!position) {
    element.style.removeProperty("transform");
    element.style.removeProperty("transform-origin");
    return;
  }
  element.style.transform = "translate(" + position.x + "vw, " + position.y + "vw) scale(" + position.scale + ")";
  element.style.transformOrigin = "top left";
}

function applyLayout(root, layouts) {
  root.querySelectorAll("[data-layout-id]").forEach(element => {
    applyPosition(element, layouts?.[element.dataset.layoutId]);
  });
}

function action(label, target, cssClass = "button") {
  return '<a class="' + cssClass + '" href="' + escapeHtml(target) + '">' + escapeHtml(label) +
    ' <span class="link-arrow" aria-hidden="true"></span></a>';
}

function brand() {
  return '<a class="brand" href="' + href("index") + '"><span class="brand-icon" aria-hidden="true">tc</span><span>Teachers Connect</span></a>';
}

function renderHeader() {
  const nav = [["index", "Home"], ["conclave", "Conclave"], ["initiatives", "Initiatives"], ["updates", "Updates"]];
  document.querySelector("#site-header").innerHTML =
    (isDraft ? '<div class="draft-banner"><span>Draft preview</span><a href="/admin">Return to admin</a></div>' : "") +
    '<header class="header"><div class="wrap header-inner">' + brand() +
    '<nav aria-label="Main navigation">' + nav.map(([target, label]) =>
      '<a href="' + href(target) + '"' + (page === target ? ' aria-current="page"' : "") + ">" + label + "</a>"
    ).join("") + '</nav>' + action("Conclave details", href("conclave"), "button button-header") + '</div></header>';
  document.querySelector("#site-footer").innerHTML =
    '<footer class="footer"><div class="wrap footer-inner"><div>' + brand() +
    '<p>Events and initiatives for teachers and schools.</p></div><div class="footer-links">' +
    '<a href="' + href("conclave") + '">Education Conclave</a><a href="' + href("initiatives") +
    '">Initiatives</a><a href="' + href("updates") +
    '">Updates</a></div></div></footer>';
}

function dateLabel(event) {
  const date = model.eventDate(event);
  return event.dateStatus === "Tentative" ? date + " (tentative)" : date;
}

function locationLabel(event) {
  return [event.venue, event.city].filter(Boolean).join(", ") || "Location to be announced";
}

function postList(content, kind) {
  return content.posts.filter(post => post.kind === kind)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}

function postHref(post) {
  return href("post", { id: post.id });
}

function postCard(post, pageKey) {
  const key = pageKey + "-card-" + post.id;
  return '<article class="story-card" data-layout-id="' + escapeHtml(key) + '">' + (post.image ? '<a class="story-image" data-layout-id="' +
    escapeHtml(key + "-image") + '" href="' +
    escapeHtml(postHref(post)) + '" tabindex="-1" aria-hidden="true">' + picture(post.image, "cover") + '</a>' : "") +
    '<div class="story-copy"><h3 data-layout-id="' + escapeHtml(key + "-title") + '"><a href="' +
    escapeHtml(postHref(post)) + '">' + escapeHtml(post.title) +
    '</a></h3><p data-layout-id="' + escapeHtml(key + "-summary") + '">' + escapeHtml(post.summary) +
    '</p>' + action("Read more", postHref(post), "text-link") + '</div></article>';
}

function updateRow(post, pageKey) {
  const key = pageKey + "-row-" + post.id;
  return '<article class="update-row" data-layout-id="' + escapeHtml(key) + '"><div class="update-date" data-layout-id="' +
    escapeHtml(key + "-date") + '">' +
    (post.date ? '<time datetime="' + post.date + '">' + model.formatDate(post.date) + '</time>' : "Conclave update") +
    '</div><div><h3 data-layout-id="' + escapeHtml(key + "-title") + '"><a href="' +
    escapeHtml(postHref(post)) + '">' + escapeHtml(post.title) +
    '</a></h3><p data-layout-id="' + escapeHtml(key + "-summary") + '">' + escapeHtml(post.summary) + '</p></div>' +
    action("Read update", postHref(post), "text-link") + '</article>';
}

function home(content) {
  const event = content.event;
  const initiatives = postList(content, "initiative").slice(0, 2);
  const updates = postList(content, "update").slice(0, 3);
  return '<section class="hero"><div class="hero-photo" data-layout-id="home-hero-image">' + picture(event.heroImage || "conclave", "cover", "eager") +
    '</div><div class="wrap hero-inner"><div class="hero-copy" data-layout-id="home-hero-copy"><h1 data-layout-id="home-hero-title">' + escapeHtml(content.home.headlineTop) +
    '<br>' + escapeHtml(content.home.headlineMiddle) + '<br><em>' + escapeHtml(content.home.headlineEmphasis) + '</em></h1>' +
    '<p data-layout-id="home-hero-description">' + escapeHtml(content.home.description) + '</p>' +
    '<div class="actions">' + action("Explore the conclave", href("conclave"), "button button-gold") +
    '<a class="button button-outline" href="' + href("initiatives") + '">View initiatives</a></div></div></div></section>' +
    '<div class="wrap event-wrap"><section class="event-highlight" data-layout-id="home-event"><div><p class="eyebrow">Upcoming conclave</p>' +
    '<h2 data-layout-id="home-event-title">' + escapeHtml(event.title) + '</h2></div><div class="event-aside" data-layout-id="home-event-details"><strong>' + escapeHtml(dateLabel(event)) +
    '</strong><span data-layout-id="home-event-location">' + escapeHtml(locationLabel(event)) + '</span>' +
    action("Event details", href("conclave"), "text-link") + '</div></section></div>' +
    '<section class="wrap section" data-layout-id="home-initiatives"><div class="section-heading"><h2 data-layout-id="home-initiatives-title">Our initiatives</h2>' +
    action("All initiatives", href("initiatives"), "text-link") + '</div>' +
    (initiatives.length ? '<div class="story-grid">' + initiatives.map(post => postCard(post, "home")).join("") + '</div>' : '<p>New initiatives will appear here.</p>') +
    '</section><section class="updates-section" data-layout-id="home-updates"><div class="wrap section"><div class="section-heading"><h2 data-layout-id="home-updates-title">Latest updates</h2>' +
    action("All updates", href("updates"), "text-link") + '</div>' +
    (updates.map(post => updateRow(post, "home")).join("") || "<p>New announcements will appear here.</p>") + '</div></section>';
}

function pageIntro(title, subtitle, label = "", layoutId = "") {
  return '<section class="page-intro"' + (layoutId ? ' data-layout-id="' + escapeHtml(layoutId) + '"' : "") + '><div class="wrap">' +
    (label ? '<p class="eyebrow">' + escapeHtml(label) + '</p>' : "") +
    '<h1' + (layoutId ? ' data-layout-id="' + escapeHtml(layoutId + "-title") + '"' : "") + '>' +
    escapeHtml(title) + '</h1><p' + (layoutId ? ' data-layout-id="' + escapeHtml(layoutId + "-description") + '"' : "") +
    '>' + escapeHtml(subtitle) + '</p></div></section>';
}

function conclave(event) {
  const registration = event.registrationUrl
    ? action(event.registrationLabel, event.registrationUrl, "button button-gold")
    : action("See event updates", href("updates"), "button button-gold");
  return '<section class="event-hero"><div class="event-hero-image" data-layout-id="conclave-image">' + picture(event.heroImage || "conclave", "cover", "eager") +

    '</dl></div></section>' +
    (event.tracks.length ? '<section class="wrap section" data-layout-id="conclave-topics"><div class="section-heading"><h2 data-layout-id="conclave-topics-title">Programme topics</h2></div><div class="topics">' +
    event.tracks.map((topic, index) => '<article data-layout-id="conclave-topic-' + index + '"><h3 data-layout-id="conclave-topic-title-' + index + '">' +

    (event.awards ? '<section class="awards" data-layout-id="conclave-awards"><div class="wrap awards-inner"><h2 data-layout-id="conclave-awards-title">School Excellence Awards</h2><div class="prose">' +

      action("View updates", href("updates"), "text-link")) + '</section>';

function initiatives(content) {

function updates(content) {

    '<section class="wrap section" data-layout-id="updates-list">' + (list.map(post => updateRow(post, "updates")).join("") || '<p>New announcements will appear here.</p>') + '</section>';

function article(content) {
  const post = content.posts.find(item => item.id === query.get("id"));
  if (!post) return pageIntro("Post unavailable", "Explore the latest Teachers Connect announcements.") +
    '<div class="wrap section">' + action("View updates", href("updates")) + '</div>';
  document.title = post.title + " | Teachers Connect";
  const category = post.kind === "initiative" ? "Initiatives" : "Updates";
  return '<article><div class="article-top" data-layout-id="post-heading"><div class="wrap article-wrap"><a class="back-link" href="' +
    href(post.kind === "initiative" ? "initiatives" : "updates") + '">← ' + category + '</a><h1 data-layout-id="post-title">' +
    escapeHtml(post.title) + '</h1><p data-layout-id="post-summary">' + escapeHtml(post.summary) +
    '</p>' + (post.date ? '<time data-layout-id="post-date" datetime="' + post.date + '">' + model.formatDate(post.date) + '</time>' : "") +
    '</div></div><div class="wrap article-wrap article-body">' + (post.image ? '<div data-layout-id="post-image">' + picture(post.image, "article-photo", "eager") + '</div>' : "") +
    '<div class="prose" data-layout-id="post-body">' + textBlocks(post.body, "post-paragraph") + '</div>' +
    (post.linkUrl ? action(post.linkLabel, post.linkUrl) : "") +
    (post.id === "education-conclave-planning" ? action("Conclave details", href("conclave")) : "") +
    '</div></article>';
}

function posterMarkup(poster, preview = false) {
  if ((!poster.enabled && !preview) || !poster.image) return "";
  return '<aside class="event-poster' + (preview ? " event-poster-preview" : "") +
    '" data-layout-id="event-poster" aria-label="Event poster"><img src="' +
    escapeHtml(poster.image) + '" alt="Event poster"></aside>';
}

function getDraft() {
  if (sessionDraft) return sessionDraft;
  try {
    const raw = localStorage.getItem(model.DRAFT_KEY);
    return raw ? model.validate(JSON.parse(raw)) : null;
  } catch {
    return null;
  }
}

function field(label, name, value = "", options = {}) {
  const { type = "text", required = false, max, rows = 4, placeholder = "" } = options;
  const attributes = ' name="' + name + '" ' + (required ? 'required ' : '') + (max ? 'maxlength="' + max + '" ' : '');
  const help = placeholder ? ' placeholder="' + escapeHtml(placeholder) + '"' : "";
  return '<label class="field"><span>' + escapeHtml(label) + '</span>' +
    (type === "textarea"
      ? '<textarea rows="' + rows + '"' + attributes + help + '>' + escapeHtml(value) + '</textarea>'
      : '<input type="' + type + '"' + attributes + help + ' value="' + escapeHtml(value) + '">') + '</label>';
}

function selectField(label, name, options, value) {
  return '<label class="field"><span>' + escapeHtml(label) + '</span><select name="' + name + '">' +
    options.map(([key, title]) => '<option value="' + escapeHtml(key) + '"' +
      (key === value ? ' selected' : "") + '>' + escapeHtml(title) + '</option>').join("") +
    '</select></label>';
}

function programmeFields(topics) {
  const rows = Array.from({ length: Math.min(8, Math.max(4, topics.length + 1)) }, (_, index) => topics[index] || {});
  return '<fieldset><legend>Programme topics</legend><p class="form-help">Leave both fields empty to omit a topic.</p>' +
    rows.map((topic, index) => '<div class="form-row topic-fields">' +
      field("Topic " + (index + 1), "topicTitle" + index, topic.title, { max: 75 }) +
      field("Description " + (index + 1), "topicDescription" + index, topic.description, { max: 350 }) +
      '</div>').join("") + '</fieldset>';
}

function homeForm(home) {

    field("Headline line 1", "headlineTop", home.headlineTop, { max: 65, required: true }) +
    field("Headline line 2", "headlineMiddle", home.headlineMiddle, { max: 65, required: true }) +
    field("Emphasized headline line", "headlineEmphasis", home.headlineEmphasis, { max: 65, required: true }) +

function posterForm(poster) {

    '<p class="form-help">Upload a poster to Cloudinary. Save this draft and publish changes to show it on the public pages.</p>' +
    (poster.image ? '<div class="poster-preview"><img src="' + escapeHtml(poster.image) + '" alt="Current event poster"></div>' :

function eventForm(event) {
  return '<form id="event-form"><h2>Education Conclave</h2>' +
    field("Event title", "title", event.title, { required: true, max: 110 }) +
    '<div class="form-row">' + field("Date", "date", event.date, { type: "date" }) +

function postForm(post, creating) {

function imageUploadField(target) {

    '<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-cloudinary-target="' +

function indiaToday() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    year: "numeric", month: "2-digit", day: "2-digit", timeZone: "Asia/Kolkata"
  }).formatToParts();
  const get = type => parts.find(part => part.type === type).value;
  return [get("year"), get("month"), get("day")].join("-");
}

async function editor(published) {
  if (!supabase) {
    main.innerHTML = pageIntro("Admin sign in", "Connect Supabase to enable administrator login. Follow the setup guide below to configure your project.") +
      '<div class="wrap section article-wrap"><form aria-label="Admin sign in">' +
      '<label class="field"><span>Email</span><input type="email" autocomplete="username" disabled placeholder="Configure Supabase first"></label>' +
      '<label class="field"><span>Password</span><input type="password" autocomplete="current-password" disabled placeholder="Configure Supabase first"></label>' +
      '<button class="button" type="button" disabled>Sign in</button>' +
      '<p class="form-help">Sign-in is disabled until <code>VITE_SUPABASE_URL</code> and <code>VITE_SUPABASE_ANON_KEY</code> are set in <code>.env.local</code>. Restart the dev server after saving the file.</p>' +
      '</form></div>' + adminSetupGuide();
    return;
  }
  const { data: userResult, error: userError } = await supabase.auth.getUser();
  if (userError && userError.name !== "AuthSessionMissingError") {
    main.innerHTML = pageIntro("Admin unavailable", "Could not check the Supabase session: " + userError.message);
    return;
  }
  const user = userResult?.user;
  if (!user) {
    main.innerHTML = pageIntro("Admin sign in", "Sign in to edit and publish Teachers Connect content.") +
      '<div class="wrap section article-wrap"><form id="admin-login">' +
      field("Email", "email", "", { type: "email", required: true }) +
      field("Password", "password", "", { type: "password", required: true }) +
      '<button class="button" type="submit">Sign in</button>' +
      '<p id="editor-message" class="editor-message" role="status" aria-live="polite"></p></form></div>' +
      adminSetupGuide();
    document.querySelector("#admin-login").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      const { error } = await supabase.auth.signInWithPassword({
        email: new FormData(form).get("email").toString(),
        password: new FormData(form).get("password").toString()
      });
      if (error) {
        button.disabled = false;
        const status = document.querySelector("#editor-message");
        status.textContent = "Sign in failed: " + error.message;
        status.classList.add("error");
        return;
      }
      await editor(published);
    });
    return;
  }
  const { data: isAdmin, error: adminCheckError } = await supabase.rpc("is_site_admin");
  if (adminCheckError || !isAdmin) {
    const detail = adminCheckError
      ? "Could not verify admin access: " + adminCheckError.message
      : "This account is not an administrator. Add its user ID to public.site_admins in Supabase.";
    main.innerHTML = pageIntro("Admin access required", detail) +
      '<div class="wrap section"><button class="button button-quiet" id="admin-signout" type="button">Sign out</button></div>';
    document.querySelector("#admin-signout").addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();
      if (error) {
        main.innerHTML = pageIntro("Sign out failed", error.message);
        return;
      }
      await editor(published);
    });
    return;
  }
  let savedDraft = getDraft();
  let current = savedDraft || published;
  let selected = "form:home";
  let formDirty = false;
  let layoutDirty = false;
  let designPage = "index";
  let selectedDesignId = "";
  main.innerHTML = pageIntro("Content editor", "Edit event details, initiatives and announcements; publish to update the public site.") +
    '<div class="wrap section editor"><div class="editor-tools"><div><h2>Publish your updates</h2>' +
    '<p>Save individual forms as a browser draft, then publish the draft to make it live for everyone.</p>' +
    '<p id="draft-state" class="draft-state"></p></div><div class="actions">' +
    '<a class="button button-secondary" href="#index?draft=1">Preview drafts <span class="link-arrow" aria-hidden="true"></span></a>' +
    '<button class="button" id="publish-content" type="button">Publish changes</button>' +
    '<button class="button button-quiet" id="export-draft" type="button">Export content</button>' +
    '<button class="button button-quiet" id="import-draft" type="button">Import content</button>' +
    '<button class="button button-quiet" id="admin-signout" type="button">Sign out</button>' +
    '<input id="import-file" type="file" accept=".json,application/json" hidden></div></div>' +
    '<p id="editor-message" class="editor-message" role="status" aria-live="polite"></p>' +
    '<div class="editor-layout"><aside aria-label="Select content"><div class="editor-selector" id="editor-selector"></div>' +
    '<button class="button button-quiet reset-draft" id="reset-draft" type="button">Discard local draft</button></aside>' +
    '<section class="editor-form" id="editor-form"></section></div>' +
    '<section class="design-editor"><div><h2>Free canvas layout</h2>' +
    '<p>Drag outlined images, text groups, cards, and sections to reposition them. Use the slider to resize. Select Event poster to adjust the poster shown on every public page.</p></div>' +
    '<div class="form-row"><label class="field"><span>Page</span><select id="design-page">' +
    '<option value="index">Home</option><option value="conclave">Conclave</option>' +
    '<option value="initiatives">Initiatives</option><option value="updates">Updates</option>' +
    '<option value="post">Article template</option><option value="poster">Event poster</option></select></label>' +
    '<label class="field"><span>Resize selected element</span><input id="design-scale" type="range" min="0.25" max="4" step="0.05" value="1"></label></div>' +
    '<div class="actions"><button class="button" id="save-layout" type="button">Save layout draft</button>' +
    '<button class="button button-quiet" id="reset-layout" type="button">Reset this page layout</button></div>' +
    '<p id="design-status" class="editor-message" role="status" aria-live="polite">Drag a highlighted element to position it.</p>' +
    '<div class="design-stage-scroll"><div class="design-stage" id="design-stage"></div></div></section></div>';

  const message = (text, error = false) => {
    const element = document.querySelector("#editor-message");
    element.textContent = text;
    element.classList.toggle("error", error);
  };

  function setDraft(candidate) {
    const next = model.validate(candidate);
    sessionDraft = next;
    try {
      localStorage.setItem(model.DRAFT_KEY, JSON.stringify(next));
      draftIsPersistent = true;
    } catch {
      draftIsPersistent = false;
    }
    current = next;
    savedDraft = next;
    formDirty = false;
    layoutDirty = false;
  }

  function canLeaveForm() {
    return (!formDirty && !layoutDirty) || window.confirm("Discard unsaved content or layout changes?");
  }

  function drawEditor() {
    document.querySelector("#draft-state").textContent = savedDraft
      ? (draftIsPersistent ? "Local draft saved; changes are not public yet." : "Session draft saved; changes are not public yet.")
      : "Editing the currently published content";
    const selector = document.querySelector("#editor-selector");
    const choices = [["form:home", "Home page"], ["form:event", "Conclave details"], ["form:poster", "Event poster"], ["form:new", "+ New post"],
      ...current.posts.map(post => [post.id, post.title])];
    selector.innerHTML = choices.map(([id, label]) => '<button type="button" data-select="' +
      escapeHtml(id) + '" aria-pressed="' + (id === selected) + '">' + escapeHtml(label) + '</button>').join("");
    const post = current.posts.find(item => item.id === selected);
    const emptyPost = { kind: "update", title: "", summary: "", body: "", date: indiaToday(), image: "", linkLabel: "", linkUrl: "" };
    document.querySelector("#editor-form").innerHTML = selected === "form:home" ? homeForm(current.home)
      : selected === "form:event" ? eventForm(current.event)
        : selected === "form:poster" ? posterForm(current.poster) : postForm(post || emptyPost, !post);
    drawDesignPreview();
  }

  function layoutMarkup(target) {
    const previousPage = page;
    const previousQuery = query;
    const previousDraft = isDraft;
    const previousTitle = document.title;
    page = target;
    query = target === "post" && current.posts[0]
      ? new URLSearchParams({ id: current.posts[0].id })
      : new URLSearchParams();
    isDraft = false;
    try {
      if (target === "index") return home(current);
      if (target === "conclave") return conclave(current.event);
      if (target === "initiatives") return initiatives(current);
      if (target === "updates") return updates(current);
      if (target === "poster") return '<div class="poster-design-canvas">' +
        (posterMarkup(current.poster, true) ||
          '<p class="wrap empty-draft">Upload and save an event poster before adjusting its position and size.</p>') +
        '</div>';
      return article(current);
    } finally {
      page = previousPage;
      query = previousQuery;
      isDraft = previousDraft;
      document.title = previousTitle;
    }
  }

  function designPosition(id) {
    return current.layouts[designPage]?.[id] || { x: 0, y: 0, scale: 1 };
  }

  function updateDesignPosition(id, changes) {
    const positions = { ...(current.layouts[designPage] || {}) };
    positions[id] = { ...designPosition(id), ...changes };
    current.layouts = { ...current.layouts, [designPage]: positions };
    applyLayout(document.querySelector("#design-stage"), positions);
    layoutDirty = true;
    document.querySelector("#design-status").textContent = "Layout changed. Save the layout draft before publishing.";
  }

  function drawDesignPreview() {
    const stage = document.querySelector("#design-stage");
    if (!stage) return;
    stage.innerHTML = layoutMarkup(designPage);
    applyLayout(stage, current.layouts[designPage] || {});
    selectedDesignId = "";
    document.querySelector("#design-scale").value = "1";
  }

  document.querySelector("#editor-selector").addEventListener("click", event => {
    const button = event.target.closest("[data-select]");
    if (!button || button.dataset.select === selected || !canLeaveForm()) return;
    selected = button.dataset.select;
    formDirty = false;
    message("");
    drawEditor();
    document.querySelector("#editor-form input, #editor-form select")?.focus();
  });

  const editorForm = document.querySelector("#editor-form");
  editorForm.addEventListener("input", () => { formDirty = true; });
  const designStage = document.querySelector("#design-stage");
  let activeDrag = null;
  designStage.addEventListener("pointerdown", event => {
    const element = event.target.closest("[data-layout-id]");
    if (!element || event.button !== 0) return;
    event.preventDefault();
    selectedDesignId = element.dataset.layoutId;
    designStage.querySelectorAll("[data-layout-selected]").forEach(item => delete item.dataset.layoutSelected);
    element.dataset.layoutSelected = "true";
    document.querySelector("#design-scale").value = String(designPosition(selectedDesignId).scale);
    const position = designPosition(selectedDesignId);
    activeDrag = {
      id: selectedDesignId,
      element,
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      x: position.x,
      y: position.y,
      moved: false
    };
    designStage.setPointerCapture(event.pointerId);
  });
  designStage.addEventListener("pointermove", event => {
    if (!activeDrag || event.pointerId !== activeDrag.pointerId) return;
    const width = Math.max(window.innerWidth, 1);
    const deltaX = event.clientX - activeDrag.startX;
    const deltaY = event.clientY - activeDrag.startY;
    if (!activeDrag.moved && Math.hypot(deltaX, deltaY) < 3) return;
    activeDrag.moved = true;
    updateDesignPosition(activeDrag.id, {
      x: Math.max(-500, Math.min(500, activeDrag.x + deltaX / width * 100)),
      y: Math.max(-500, Math.min(500, activeDrag.y + deltaY / width * 100))
    });
  });
  function finishLayoutDrag(event) {
    if (!activeDrag || event.pointerId !== activeDrag.pointerId) return;
    if (designStage.hasPointerCapture(event.pointerId)) designStage.releasePointerCapture(event.pointerId);
    activeDrag = null;
  }
  designStage.addEventListener("pointerup", finishLayoutDrag);
  designStage.addEventListener("pointercancel", finishLayoutDrag);
  designStage.addEventListener("click", event => {
    if (event.target.closest("a")) event.preventDefault();
  });
  document.querySelector("#design-page").addEventListener("change", event => {
    if (layoutDirty) {
      event.target.value = designPage;
      document.querySelector("#design-status").textContent = "Save or reset this page layout before switching pages.";
      return;
    }
    designPage = event.target.value;
    drawDesignPreview();
    document.querySelector("#design-status").textContent = "Drag an outlined element to position it.";
  });
  document.querySelector("#design-scale").addEventListener("input", event => {
    if (!selectedDesignId) {
      document.querySelector("#design-status").textContent = "Select an outlined element before resizing.";
      event.target.value = "1";
      return;
    }
    updateDesignPosition(selectedDesignId, { scale: Number(event.target.value) });
  });
  document.querySelector("#save-layout").addEventListener("click", () => {
    if (formDirty) {
      message("Save the current content form before saving the layout.", true);
      return;
    }
    if (!layoutDirty) {
      document.querySelector("#design-status").textContent = "There are no unsaved layout changes.";
      return;
    }
    try {
      setDraft(current);
      document.querySelector("#draft-state").textContent = draftIsPersistent
        ? "Local draft saved; changes are not public yet."
        : "Session draft saved; changes are not public yet.";
      document.querySelector("#design-status").textContent = "Layout draft saved. Publish changes to make it public.";
    } catch (error) {
      document.querySelector("#design-status").textContent = error.message;
    }
  });
  document.querySelector("#reset-layout").addEventListener("click", () => {
    if (!window.confirm("Reset all positions and sizes on this page? Save the layout draft to keep this reset.")) return;
    const layouts = { ...current.layouts };
    delete layouts[designPage];
    current.layouts = layouts;
    selectedDesignId = "";
    layoutDirty = true;
    drawDesignPreview();
    document.querySelector("#design-status").textContent = "Page layout reset locally. Save the layout draft to keep this reset.";
  });
  editorForm.addEventListener("change", async event => {
    const input = event.target.closest("[data-cloudinary-target]");
    const file = input?.files?.[0];
    if (!file) return;
    try {
      const imageUrl = await uploadImage(file);
      const target = { heroImage: "heroImage", imageUrl: "imageUrl", posterImage: "imageUrl" }[input.dataset.cloudinaryTarget];
      if (!target) throw new Error("Choose a valid image field.");
      const urlInput = editorForm.querySelector('[name="' + target + '"]');
      urlInput.value = imageUrl;
      urlInput.dispatchEvent(new Event("input", { bubbles: true }));
      message("Image uploaded. Save this form to include it in the draft.");
    } catch (error) {
      message(error.message, true);
    } finally {
      input.value = "";
    }
  });
  editorForm.addEventListener("submit", event => {
    event.preventDefault();
    const fields = Object.fromEntries(new FormData(event.target));
    try {
      if (event.target.id === "home-form") {
        const updated = model.validateHome(fields);
        setDraft({ ...current, home: updated });
        message("Home page draft saved. Publish changes when ready.");
      } else if (event.target.id === "poster-form") {
        const poster = model.validatePoster({ image: fields.imageUrl, enabled: fields.showPoster === "on" });
        setDraft({ ...current, poster });
        message("Event poster draft saved. Publish changes when ready.");
      } else if (event.target.id === "event-form") {
        const tracks = [];
        for (let index = 0; index < 8; index++) {
          const title = fields["topicTitle" + index]?.trim();
          const description = fields["topicDescription" + index]?.trim();
          if (title || description) tracks.push({ title: title || "", description: description || "" });
        }
        const updated = model.validateEvent({ ...fields, tracks });
        setDraft({ ...current, event: updated });
        message("Conclave draft saved. Publish changes when ready.");
      } else {
        const previous = current.posts.find(post => post.id === selected);
        const id = previous?.id || model.newId(fields.title, current.posts);
        const post = model.validatePost({ ...fields, image: fields.imageUrl || fields.imagePreset, id });
        const posts = previous ? current.posts.map(item => item.id === id ? post : item) : [...current.posts, post];
        setDraft({ ...current, posts });
        selected = id;
        message("Post draft saved. Publish changes when ready.");
      }
      drawEditor();
    } catch (error) { message(error.message, true); }
  });

  editorForm.addEventListener("click", event => {
    if (event.target.id !== "remove-post" || !window.confirm("Remove this post from the draft?")) return;
    try {
      setDraft({ ...current, posts: current.posts.filter(post => post.id !== selected) });
      selected = "form:new";
      drawEditor();
      message("Post removed from the draft.");
    } catch (error) { message(error.message, true); }
  });

  document.querySelector("#reset-draft").addEventListener("click", () => {
    if (!savedDraft && !formDirty && !layoutDirty) return message("There is no local draft to discard.");
    if (!window.confirm("Discard the local draft and reload the published content?")) return;
    try {
      if (draftIsPersistent) localStorage.removeItem(model.DRAFT_KEY);
      sessionDraft = null;
      savedDraft = null;
      current = published;
      selected = "form:home";
      formDirty = false;
      layoutDirty = false;
      drawEditor();
      message("Local draft discarded. Published content loaded in the editor.");
    } catch (error) { message(error.message, true); }
  });

  document.querySelector("#publish-content").addEventListener("click", async event => {
    if (formDirty || layoutDirty) return message("Save the current form and layout draft before publishing.", true);
    event.currentTarget.disabled = true;
    const { error } = await supabase.from("site_content").upsert({
      id: "main",
      content: current,
      updated_at: new Date().toISOString(),
      updated_by: user.id
    }, { onConflict: "id" });
    event.currentTarget.disabled = false;
    if (error) {
      message("Could not publish changes: " + error.message, true);
      return;
    }
    message("Changes published. The public website is now updated.");
  });

  document.querySelector("#admin-signout").addEventListener("click", async () => {
    const { error } = await supabase.auth.signOut();
    if (error) {
      message("Sign out failed: " + error.message, true);
      return;
    }
    await editor(published);
  });

  document.querySelector("#export-draft").addEventListener("click", () => {
    if (formDirty || layoutDirty) return message("Save the current form and layout draft before exporting.", true);
    downloadFile(JSON.stringify(current, null, 2) + "\n", "application/json", "teachers-connect-content.json");
    message("Content file exported.");
  });

  const importFile = document.querySelector("#import-file");
  document.querySelector("#import-draft").addEventListener("click", () => {
    if (canLeaveForm()) importFile.click();
  });
  importFile.addEventListener("change", async () => {
    const file = importFile.files[0];
    importFile.value = "";
    if (!file) return;
    try {
      if (file.size > 5_000_000) throw new Error("Choose a content file smaller than 5 MB.");
      const imported = model.validate(JSON.parse(await file.text()));
      if (savedDraft && !window.confirm("Replace this browser’s draft with the imported content?")) return;
      setDraft(imported);
      selected = "form:home";
      drawEditor();
      message("Imported content saved as a draft.");
    } catch (error) { message("Could not import content. " + error.message, true); }
  });

  canLeaveEditor = canLeaveForm;
  window.onbeforeunload = event => {
    if (formDirty || layoutDirty) {
      event.preventDefault();
      event.returnValue = "";
    }
  };
  drawEditor();
}

async function uploadImage(file) {
  if (!cloudinaryCloud || !cloudinaryPreset) {
    throw new Error("Set VITE_CLOUDINARY_CLOUD_NAME and VITE_CLOUDINARY_UPLOAD_PRESET to enable image uploads.");
  }
  if (!["image/jpeg", "image/png", "image/webp", "image/gif"].includes(file.type)) {
    throw new Error("Choose a JPG, PNG, WebP or GIF image.");
  }
  if (file.size > 10 * 1024 * 1024) throw new Error("Choose an image smaller than 10 MB.");
  const body = new FormData();
  body.append("file", file);
  body.append("upload_preset", cloudinaryPreset);
  const response = await fetch("https://api.cloudinary.com/v1_1/" +
    encodeURIComponent(cloudinaryCloud) + "/image/upload", { method: "POST", body });
  const result = await response.json();
  if (!response.ok || !result.secure_url) {
    throw new Error(result.error?.message || "Cloudinary could not upload this image.");
  }
  return result.secure_url;
}

function downloadFile(text, type, filename) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function start() {
  const requestUrl = location.href;
  const [hashTarget, hashSearch] = location.hash.slice(1).split("?", 2);
  const isAdminPath = location.pathname.replace(/\/+$/, "") === "/admin";
  const target = hashTarget || (isAdminPath ? "editor" : "index");
  const search = hashSearch || (isAdminPath ? location.search.slice(1) : "");
  page = Object.hasOwn(pageTitles, target) ? target : "index";
  query = new URLSearchParams(search);
  isDraft = query.get("draft") === "1" && page !== "editor";
  lastRenderedUrl = location.href;
  canLeaveEditor = null;
  window.onbeforeunload = null;
  document.title = pageTitles[page];
  renderHeader();
  try {
    let published = model.validate(JSON.parse(document.querySelector("#site-content").textContent));
    if (supabase) {
      const { data, error } = await supabase.from("site_content").select("content").eq("id", "main").maybeSingle();
      if (error) throw new Error("Could not load published content from Supabase: " + error.message);
      if (data?.content) published = model.validate(data.content);
    }
    if (location.href !== requestUrl) return;
    if (page === "editor") return await editor(published);
    const draft = isDraft ? getDraft() : null;
    const content = draft || published;
    const routes = {
      index: () => home(content),
      conclave: () => conclave(content.event),
      initiatives: () => initiatives(content),
      updates: () => updates(content),
      post: () => article(content)
    };
    main.innerHTML = (isDraft && !draft ? '<p class="wrap empty-draft">Save a draft in the content editor to preview changes. This view shows the content in the file.</p>' : "") +
      (routes[page] || routes.index)() + posterMarkup(content.poster);
    applyLayout(main, content.layouts[page] || {});
    applyPosition(main.querySelector('.event-poster[data-layout-id="event-poster"]'),
      content.layouts.poster?.["event-poster"]);
  } catch (error) {
    console.error(error);
    main.innerHTML = pageIntro("Content unavailable", "Could not load site content: " + error.message);
  }
}

document.querySelector(".skip-link").addEventListener("click", event => {
  event.preventDefault();
  main.focus();
});

if (supabase) {
  supabase.channel("teachers-connect-published-content")
    .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "site_content",
      filter: "id=eq.main"
    }, () => {
      if (page !== "editor" && !isDraft) start();
    })
    .subscribe();
}

window.addEventListener("hashchange", () => {
  if (canLeaveEditor && !canLeaveEditor()) {
    history.replaceState(null, "", lastRenderedUrl);
    return;
  }
  start();
  main.focus({ preventScroll: true });
  window.scrollTo(0, 0);
});

start();

</script>
